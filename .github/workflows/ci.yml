name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux build + physics tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-mixer-dev libglew-dev libglm-dev
      - run: make
      - run: make test

  macos:
    name: macOS build + physics tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install sdl2 sdl2_mixer glm llvm
      - run: make
      - run: make test

  web:
    name: WebAssembly build (Emscripten)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - run: sudo apt-get install -y libglm-dev vorbis-tools
      - run: make web
      - run: make test-web-story
      - run: make test-web-lighting
      - run: python3 tests/test_web_release.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_web_pointer_lock.mjs
      - run: npm install --prefix build/browser-smoke --no-save playwright@1.65.0
      - run: build/browser-smoke/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise the built game in Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 -d web/dist > build/web-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          OVERDRIVE_PLAYWRIGHT="$PWD/build/browser-smoke/node_modules/playwright/index.mjs" node tests/test_web_smoke.mjs http://127.0.0.1:8765/ build/browser-smoke/captures
          OVERDRIVE_PLAYWRIGHT="$PWD/build/browser-smoke/node_modules/playwright/index.mjs" node tests/test_web_audio.mjs http://127.0.0.1:8765/ build/browser-smoke/captures/audio.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-captures
          path: build/browser-smoke/captures/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: overdrive-web
          path: web/dist/
          if-no-files-found: error
          retention-days: 3
